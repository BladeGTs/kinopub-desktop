name: Desktop builds

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: ubuntu-24.04
            arch: x64
          - os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --dir app
      - name: Build desktop application
        run: pnpm --dir app desktop:build --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Validate macOS signature
        if: matrix.os == 'macos-15'
        run: codesign --verify --deep --strict --verbose=2 app/release/mac-arm64/KinoPub.app
      - uses: actions/upload-artifact@v7
        with:
          name: kinopub-${{ matrix.os }}
          path: |
            app/release/*.exe
            app/release/*.AppImage
            app/release/*.deb
            app/release/*.dmg
            app/release/*.zip
          if-no-files-found: error
